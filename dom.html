  <style type="text/css" data-vite-dev-id="C:/Users/AliCom/Desktop/VOCABreminder/src/index.css">:root {
  /* Brand Palette (Modern Electric Violet & Indigo - No plain blue) */
  --primary: #7C3AED;
  --primary-hover: #6D28D9;
  --primary-active: #5B21B6;
  --primary-50: #F5F3FF;
  --primary-100: #EDE9FE;
  --primary-200: #DDD6FE;
  --primary-500: #8B5CF6;
  --primary-600: #7C3AED;
  --primary-700: #6D28D9;
  --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #6366F1 50%, #4F46E5 100%);
  --primary-glow: rgba(124, 58, 237, 0.35);

  /* Emerald & Mint (Success, Leitner Mastery, Growth) */
  --success: #10B981;
  --success-light: #ECFDF5;
  --success-dark: #047857;
  --success-glow: rgba(16, 185, 129, 0.25);

  /* Solar Amber & Gold (Streak Fire, Coins, Stars, Pro) */
  --gold: #F59E0B;
  --gold-light: #FFFBEB;
  --gold-dark: #B45309;
  --gold-gradient: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
  --gold-glow: rgba(245, 158, 11, 0.3);

  /* Danger / Errors */
  --danger: #EF4444;
  --danger-light: #FEF2F2;
  --danger-dark: #B91C1C;

  /* Typography */
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-heading: 'Outfit', var(--font-main);

  /* Radii & Transitions */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-bounce: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Light Theme Variables */
[data-theme='light'], :root:not([data-theme='dark']) {
  --bg-page: #F8FAFC;
  --bg-surface: #FFFFFF;
  --bg-surface-elevated: #FFFFFF;
  --bg-subtle: #F1F5F9;
  --bg-subtle-hover: #E2E8F0;
  --border-subtle: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.16);

  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-tertiary: #94A3B8;
  --text-inverted: #FFFFFF;

  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 24px -4px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
  --shadow-primary: 0 8px 20px -4px rgba(124, 58, 237, 0.35);

  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(255, 255, 255, 0.5);
}

/* Dark Theme Variables */
[data-theme='dark'] {
  --bg-page: #0B0F19;
  --bg-surface: #121827;
  --bg-surface-elevated: #1B2236;
  --bg-subtle: #1E293B;
  --bg-subtle-hover: #2B384E;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);

  --text-primary: #F8FAFC;
  --text-secondary: #CBD5E1;
  --text-tertiary: #64748B;
  --text-inverted: #0B0F19;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.6);
  --shadow-primary: 0 8px 25px -2px rgba(124, 58, 237, 0.5);

  --glass-bg: rgba(18, 24, 39, 0.85);
  --glass-border: rgba(255, 255, 255, 0.1);
}

/* Reset and Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: var(--font-main);
  background-color: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color var(--transition-normal), color var(--transition-normal);
  overflow-x: hidden;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
  outline: none;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--primary-500);
}

/* App Container Layout */
.app-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
  max-width: 480px; /* Mobile optimal width */
  margin: 0 auto;
  background: var(--bg-surface);
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
  position: relative;
  overflow: hidden;
}

@media (min-width: 640px) {
  body {
    background-color: var(--bg-page);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px 0;
  }
  .app-container {
    min-height: 92vh;
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-subtle);
  }
}

/* Glassmorphism Classes */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 15px var(--primary-glow); }
  50% { box-shadow: 0 0 25px var(--primary-glow); }
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-4px); }
}

.animate-fade {
  animation: fadeIn var(--transition-normal) forwards;
}

.animate-slide-up {
  animation: slideUp var(--transition-bounce) forwards;
}

.animate-float {
  animation: float 3s ease-in-out infinite;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
  width: 90%;
  max-width: 420px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.toast.success {
  background: #ECFDF5;
  color: #065F46;
  border: 1px solid #A7F3D0;
}
[data-theme='dark'] .toast.success {
  background: #064E3B;
  color: #A7F3D0;
  border: 1px solid #059669;
}

.toast.info {
  background: var(--primary-50);
  color: var(--primary-700);
  border: 1px solid var(--primary-200);
}
[data-theme='dark'] .toast.info {
  background: #2E1065;
  color: #DDD6FE;
  border: 1px solid #6D28D9;
}

.toast.error {
  background: #FEF2F2;
  color: #991B1B;
  border: 1px solid #FECACA;
}
[data-theme='dark'] .toast.error {
  background: #7F1D1D;
  color: #FECACA;
  border: 1px solid #DC2626;
}
</style></head>
